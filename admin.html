<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>콩다리 관리자</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root{--ink:#173b35;--paper:#f4f0e8;--white:#fffdf8;--clay:#c86849;--muted:#70847f;--line:rgba(23,59,53,.16);--danger:#a3412f}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans KR",sans-serif}button,input,select{font:inherit}.hidden{display:none!important}.brand{font-weight:800;font-size:25px;letter-spacing:.02em}.brand span{color:var(--clay)}.auth-shell{min-height:100vh;display:grid;place-items:center;padding:24px}.login,.password-reset{width:min(430px,100%);background:var(--white);padding:38px;box-shadow:0 18px 60px rgba(23,59,53,.08)}.eyebrow{font:11px "DM Mono",monospace;letter-spacing:.13em;color:var(--clay)}.login h1,.password-reset h1{font-size:31px;letter-spacing:-.06em;margin:26px 0 9px}.login p,.password-reset p{font-size:14px;line-height:1.7;margin:0 0 25px}.field{display:block;margin:17px 0}.field span{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:12px 0;color:var(--ink);outline:none}.field input:focus{border-color:var(--ink)}.button{width:100%;border:0;padding:14px;background:var(--ink);color:white;font-weight:700;cursor:pointer}.button.alt{margin-top:10px;background:transparent;color:var(--ink);border:1px solid var(--ink)}.button:disabled{opacity:.55;cursor:wait}.status{min-height:20px;margin:14px 0 0!important;color:var(--clay);font-size:12px!important}
    .admin{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:235px;padding:34px 26px;background:var(--ink);color:var(--paper);display:flex;flex-direction:column}.sidebar .brand{color:white}.nav-label{font:10px "DM Mono",monospace;letter-spacing:.13em;color:#a9bbb5;margin:55px 0 13px}.nav-item{padding:13px 14px;background:rgba(255,255,255,.1);border-left:3px solid var(--clay);font-size:14px;font-weight:700}.sidebar-bottom{margin-top:auto}.account{font-size:12px;line-height:1.65;color:#c7d3cf;margin-bottom:14px}.logout{width:100%;padding:11px;border:1px solid rgba(255,255,255,.35);background:transparent;color:white;cursor:pointer}.content{margin-left:235px;padding:42px clamp(22px,4vw,64px) 80px}.page-head{display:flex;align-items:end;justify-content:space-between;gap:25px;margin-bottom:28px}.page-head h1{font-size:36px;letter-spacing:-.065em;margin:8px 0 0}.refresh{border:1px solid var(--ink);background:transparent;color:var(--ink);padding:10px 16px;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-bottom:20px}.stat{background:var(--white);padding:21px}.stat span{display:block;font-size:12px;color:var(--muted)}.stat strong{display:block;font:700 30px "DM Mono",monospace;margin-top:7px}.tools{display:flex;gap:10px;align-items:center;background:var(--white);padding:13px;margin-bottom:13px}.search{flex:1;min-width:160px;border:1px solid var(--line);padding:10px 12px;background:white;color:var(--ink)}.filter{border:1px solid var(--line);padding:10px;background:white;color:var(--ink)}.select-all{display:flex;align-items:center;gap:7px;font-size:12px;white-space:nowrap}.bulk-delete{border:0;background:var(--danger);color:white;padding:10px 13px;font-weight:700;cursor:pointer}.bulk-delete:disabled{opacity:.4;cursor:not-allowed}.notice{min-height:20px;color:var(--clay);font-size:12px;margin:0 0 10px}.requests{display:grid;gap:12px}.request{background:var(--white);padding:22px;border:1px solid transparent}.request.selected{border-color:var(--clay)}.request-top{display:flex;justify-content:space-between;gap:18px}.request-person{display:flex;align-items:flex-start;gap:12px}.request-select{width:18px;height:18px;margin-top:3px;accent-color:var(--ink)}.request h2{font-size:17px;letter-spacing:-.035em;margin:0}.badge{display:inline-block;margin-top:7px;padding:4px 8px;background:var(--paper);font-size:11px}.request time{font:11px "DM Mono",monospace;color:var(--muted);white-space:nowrap}.email{display:inline-block;margin:17px 0 8px;color:var(--clay);font-size:13px}.message{white-space:pre-wrap;font-size:14px;line-height:1.75;margin:0}.request-bottom{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);margin-top:20px;padding-top:14px}.state{border:0;background:var(--paper);padding:8px;color:var(--ink);font-size:12px}.delete{border:0;background:none;color:var(--danger);font-size:12px;cursor:pointer}.empty{padding:60px 20px;background:var(--white);text-align:center;color:var(--muted)}
    @media(max-width:760px){.sidebar{position:static;width:auto;height:auto;padding:20px 22px;display:flex;flex-direction:row;align-items:center;gap:18px}.nav-label,.nav-item{display:none}.sidebar-bottom{margin:0 0 0 auto;display:flex;align-items:center;gap:10px}.account{display:none}.logout{width:auto;padding:8px 11px}.content{margin:0;padding:28px 18px 60px}.page-head{align-items:flex-start}.page-head h1{font-size:30px}.stats{grid-template-columns:repeat(3,1fr)}.stat{padding:16px 12px}.stat strong{font-size:24px}.tools{flex-wrap:wrap}.search{flex-basis:100%}.select-all{margin-right:auto}.request{padding:18px}.request-top{flex-direction:column}.request time{padding-left:30px}}
  </style>
</head>
<body>
  <main class="auth-shell" id="auth-shell">
    <section class="login" id="login-view"><div class="brand">콩<span>·</span>다리</div><div class="eyebrow" style="margin-top:42px">ADMIN ONLY</div><h1>관리자 로그인</h1><p>접수된 이야기를 한곳에서 확인하고 관리합니다.</p><form id="login-form"><label class="field"><span>아이디</span><input id="username" value="admin" autocomplete="username" required /></label><label class="field"><span>비밀번호</span><input id="password" type="password" autocomplete="current-password" required /></label><button class="button" type="submit">로그인</button><button class="button alt" type="button" id="reset-password">비밀번호 재설정</button><p class="status" id="auth-status" aria-live="polite"></p></form></section>
    <section class="password-reset hidden" id="password-reset-view"><div class="brand">콩<span>·</span>다리</div><div class="eyebrow" style="margin-top:42px">SET NEW PASSWORD</div><h1>새 비밀번호 설정</h1><p>새 비밀번호를 입력해 주세요.</p><form id="new-password-form"><label class="field"><span>새 비밀번호</span><input id="new-password" type="password" minlength="6" autocomplete="new-password" required /></label><label class="field"><span>새 비밀번호 확인</span><input id="new-password-confirm" type="password" minlength="6" autocomplete="new-password" required /></label><button class="button" type="submit">비밀번호 저장</button><p class="status" id="reset-status" aria-live="polite"></p></form></section>
  </main>
  <main class="admin hidden" id="dashboard">
    <aside class="sidebar"><div class="brand">콩<span>·</span>다리</div><div class="nav-label">MANAGEMENT</div><div class="nav-item">이야기 관리</div><div class="sidebar-bottom"><div class="account"><strong>admin 관리자</strong><br />접수함 관리 중</div><button class="logout" id="logout">로그아웃</button></div></aside>
    <section class="content"><header class="page-head"><div><div class="eyebrow">INBOX MANAGEMENT</div><h1>이야기 관리</h1></div><button class="refresh" id="refresh">새로고침</button></header><div class="stats"><div class="stat"><span>전체 이야기</span><strong id="total-count">0</strong></div><div class="stat"><span>새 문의</span><strong id="new-count">0</strong></div><div class="stat"><span>답변 완료</span><strong id="replied-count">0</strong></div></div><div class="tools"><input class="search" id="search" type="search" placeholder="이름, 이메일, 내용 검색" /><select class="filter" id="status-filter"><option value="all">전체 상태</option><option value="new">새 문의</option><option value="replied">답변 완료</option><option value="archived">보관</option></select><label class="select-all"><input type="checkbox" id="select-all" /> 전체 선택</label><button class="bulk-delete" id="bulk-delete" disabled>선택 삭제</button></div><p class="notice" id="notice" aria-live="polite"></p><div class="requests" id="requests"></div></section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL='https://xulwhgzqyxxhdgqsmoux.supabase.co';
    const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh1bHdoZ3pxeXh4aGRncXNtb3V4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0NTIyMTcsImV4cCI6MjEwMjAyODIxN30.y_up4RdCJmCZkD7JXVxypBx93pDfuRBzKPdZrmZqem4';
    const ADMIN_ID='admin',ADMIN_EMAIL='agfe6981@gmail.com';
    const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
    const $=selector=>document.querySelector(selector);let allRequests=[];
    function escapeHtml(value){return String(value??'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]))}
    function showLogin(){ $('#dashboard').classList.add('hidden');$('#auth-shell').classList.remove('hidden');$('#password-reset-view').classList.add('hidden');$('#login-view').classList.remove('hidden');$('#password').value='';$('#auth-status').textContent='';allRequests=[] }
    function showReset(){ $('#dashboard').classList.add('hidden');$('#login-view').classList.add('hidden');$('#auth-shell').classList.remove('hidden');$('#password-reset-view').classList.remove('hidden') }
    async function showDashboard(session){if(!session||session.user.email!==ADMIN_EMAIL){if(session)await client.auth.signOut({scope:'local'});showLogin();return}$('#auth-shell').classList.add('hidden');$('#dashboard').classList.remove('hidden');await loadRequests()}
    function filteredRequests(){const query=$('#search').value.trim().toLowerCase(),status=$('#status-filter').value;return allRequests.filter(item=>(status==='all'||item.status===status)&&(!query||[item.name,item.email,item.topic,item.message].some(value=>String(value??'').toLowerCase().includes(query))))}
    function render(){const data=filteredRequests();$('#total-count').textContent=allRequests.length;$('#new-count').textContent=allRequests.filter(x=>x.status==='new').length;$('#replied-count').textContent=allRequests.filter(x=>x.status==='replied').length;$('#requests').innerHTML=data.length?data.map(item=>{const noEmail=!item.email||item.email==='no-email@kongdary.local';return `<article class="request"><div class="request-top"><div class="request-person"><input class="request-select" type="checkbox" value="${item.id}" aria-label="${escapeHtml(item.name)} 선택" /><div><h2>${escapeHtml(item.name)}</h2><span class="badge">${escapeHtml(item.topic)}</span></div></div><time>${new Date(item.created_at).toLocaleString('ko-KR')}</time></div>${noEmail?'<span class="email">이메일 미입력</span>':`<a class="email" href="mailto:${encodeURIComponent(item.email)}">${escapeHtml(item.email)}</a>`}<p class="message">${escapeHtml(item.message)}</p><div class="request-bottom"><select class="state" data-id="${item.id}"><option value="new" ${item.status==='new'?'selected':''}>새 문의</option><option value="replied" ${item.status==='replied'?'selected':''}>답변 완료</option><option value="archived" ${item.status==='archived'?'selected':''}>보관</option></select><button class="delete" data-id="${item.id}">삭제</button></div></article>`}).join(''):'<div class="empty">조건에 맞는 이야기가 없습니다.</div>';bindListEvents();syncSelection()}
    async function loadRequests(){const notice=$('#notice');notice.textContent='이야기를 불러오고 있습니다.';const {data,error}=await client.from('contact_requests').select('*').order('created_at',{ascending:false});if(error){notice.textContent='내용을 불러오지 못했습니다. 다시 로그인해 주세요.';return}allRequests=data;notice.textContent='';render()}
    function syncSelection(){const boxes=[...document.querySelectorAll('.request-select')],selected=boxes.filter(x=>x.checked);$('#bulk-delete').disabled=!selected.length;$('#bulk-delete').textContent=selected.length?`선택 삭제 (${selected.length})`:'선택 삭제';$('#select-all').checked=boxes.length>0&&selected.length===boxes.length;$('#select-all').indeterminate=selected.length>0&&selected.length<boxes.length;boxes.forEach(x=>x.closest('.request').classList.toggle('selected',x.checked))}
    function bindListEvents(){document.querySelectorAll('.request-select').forEach(x=>x.addEventListener('change',syncSelection));document.querySelectorAll('.state').forEach(x=>x.addEventListener('change',async()=>{const {error}=await client.from('contact_requests').update({status:x.value}).eq('id',x.dataset.id);$('#notice').textContent=error?'상태를 변경하지 못했습니다.':'상태를 변경했습니다.';if(!error){const item=allRequests.find(i=>i.id===x.dataset.id);if(item)item.status=x.value;render()}}));document.querySelectorAll('.delete').forEach(x=>x.addEventListener('click',()=>deleteItems([x.dataset.id]))) }
    async function deleteItems(ids){if(!ids.length||!confirm(`${ids.length}개의 이야기를 삭제할까요?`))return;$('#notice').textContent='삭제하고 있습니다.';const {error}=await client.from('contact_requests').delete().in('id',ids);if(error){$('#notice').textContent='삭제하지 못했습니다.';return}allRequests=allRequests.filter(item=>!ids.includes(item.id));$('#notice').textContent='선택한 이야기를 삭제했습니다.';render()}
    $('#login-form').addEventListener('submit',async event=>{event.preventDefault();const button=event.currentTarget.querySelector('[type=submit]');if($('#username').value.trim().toLowerCase()!==ADMIN_ID){$('#auth-status').textContent='아이디를 확인해 주세요.';return}button.disabled=true;$('#auth-status').textContent='로그인 중입니다.';const {data,error}=await client.auth.signInWithPassword({email:ADMIN_EMAIL,password:$('#password').value});button.disabled=false;if(error){$('#auth-status').textContent='아이디 또는 비밀번호를 확인해 주세요.';return}await showDashboard(data.session)});
    $('#logout').addEventListener('click',async()=>{const button=$('#logout');button.disabled=true;button.textContent='로그아웃 중';const {error}=await client.auth.signOut({scope:'local'});button.disabled=false;button.textContent='로그아웃';if(error){$('#notice').textContent='로그아웃하지 못했습니다. 다시 시도해 주세요.';return}showLogin()});
    $('#reset-password').addEventListener('click',async()=>{$('#auth-status').textContent='재설정 메일을 보내는 중입니다.';const {error}=await client.auth.resetPasswordForEmail(ADMIN_EMAIL,{redirectTo:'https://kongdary.vercel.app/admin.html'});$('#auth-status').textContent=error?'재설정 메일을 보내지 못했습니다.':'관리자 이메일로 재설정 링크를 보냈습니다.'});
    $('#new-password-form').addEventListener('submit',async event=>{event.preventDefault();const status=$('#reset-status'),password=$('#new-password').value;if(password!==$('#new-password-confirm').value){status.textContent='비밀번호가 일치하지 않습니다.';return}status.textContent='저장 중입니다.';const {error}=await client.auth.updateUser({password});if(error){status.textContent=error.message;return}await client.auth.signOut({scope:'local'});showLogin()});
    $('#refresh').addEventListener('click',loadRequests);$('#search').addEventListener('input',render);$('#status-filter').addEventListener('change',render);$('#select-all').addEventListener('change',event=>{document.querySelectorAll('.request-select').forEach(x=>x.checked=event.target.checked);syncSelection()});$('#bulk-delete').addEventListener('click',()=>deleteItems([...document.querySelectorAll('.request-select:checked')].map(x=>x.value)));
    client.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY')showReset();if(event==='SIGNED_OUT')showLogin();if(event==='SIGNED_IN'&&!location.hash.includes('type=recovery'))showDashboard(session)});client.auth.getSession().then(({data})=>{if(!location.hash.includes('type=recovery'))data.session?showDashboard(data.session):showLogin()});
  </script>
</body>
</html>
