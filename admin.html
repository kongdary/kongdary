<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>콩다리 관리자</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root{--ink:#173b35;--paper:#f4f0e8;--clay:#c86849;--line:rgba(23,59,53,.2)}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans KR","Apple SD Gothic Neo",sans-serif}.shell{max-width:1080px;margin:auto;padding:48px 24px 80px}.brand{font:800 24px/1 "Noto Sans KR",sans-serif;letter-spacing:-.1em}.brand span{color:var(--clay)}.login{max-width:430px;margin:12vh auto;background:#fff;padding:34px}.eyebrow{font:11px "DM Mono",monospace;letter-spacing:.1em}.login h1{font-size:30px;letter-spacing:-.06em;margin:23px 0 8px}.login p{font-size:14px;line-height:1.7;margin:0 0 24px}.field{display:block;margin:15px 0}.field span{display:block;font-size:13px;font-weight:600;margin-bottom:7px}.field input{width:100%;border:0;border-bottom:1px solid var(--line);padding:11px 0;font:15px inherit;outline:0}.button{width:100%;padding:14px;border:0;background:var(--ink);color:var(--paper);font:600 14px inherit;cursor:pointer}.button.alt{margin-top:10px;background:transparent;color:var(--ink);border:1px solid var(--ink)}.status{min-height:20px;color:var(--clay);font-size:12px;margin:14px 0 0}.dashboard{display:none}.top{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid var(--ink);padding-bottom:20px;margin:48px 0 22px}.top h1{font-size:34px;letter-spacing:-.06em;margin:0}.top p{font-size:12px;margin:7px 0 0}.logout{border:0;background:none;font:12px "DM Mono",monospace;border-bottom:1px solid currentColor;padding:0 0 5px;cursor:pointer}.summary{font-size:13px;margin:0 0 17px}.requests{display:grid;gap:13px}.request{background:#fff;padding:23px}.request-top{display:flex;justify-content:space-between;gap:18px;align-items:start}.request h2{font-size:17px;letter-spacing:-.04em;margin:0}.request time{font:11px "DM Mono",monospace;color:rgba(23,59,53,.6)}.badge{display:inline-block;margin-top:8px;background:var(--paper);padding:4px 8px;font-size:11px}.request .email{display:block;font-size:13px;color:var(--clay);margin:18px 0 9px}.request .message{white-space:pre-wrap;font-size:14px;line-height:1.75;margin:0}.request-bottom{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);margin-top:20px;padding-top:14px}.request select{border:0;background:var(--paper);font:12px inherit;padding:7px}.delete{border:0;background:none;color:#a3412f;font-size:12px;cursor:pointer}.empty{padding:55px;text-align:center;background:#fff;color:rgba(23,59,53,.65)}@media(max-width:600px){.shell{padding:30px 16px}.top{align-items:start;gap:20px;flex-direction:column}.request{padding:18px}.request-top{flex-direction:column;gap:5px}}
    </style>
  </head>
  <body>
    <main class="shell"><div class="brand">콩<span>·</span>다리</div><section class="login" id="login-view"><div class="eyebrow">ADMIN ONLY</div><h1>관리자 로그인</h1><p>이야기 남기기로 접수된 내용을 확인하고 처리합니다.</p><form id="login-form"><label class="field"><span>이메일</span><input id="email" type="email" value="agfe92@nate.com" required /></label><label class="field"><span>비밀번호</span><input id="password" type="password" minlength="8" required /></label><button class="button" type="submit">로그인</button><button class="button alt" type="button" id="signup">처음 관리자 계정 만들기</button><p class="status" id="auth-status" aria-live="polite"></p></form></section><section class="dashboard" id="dashboard"><div class="top"><div><h1>이야기 남기기</h1><p id="admin-email"></p></div><button class="logout" id="logout">로그아웃</button></div><p class="summary" id="summary"></p><div class="requests" id="requests"></div></section></main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const SUPABASE_URL='https://xulwhgzqyxxhdgqsmoux.supabase.co';
      const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh1bHdoZ3pxeXh4aGRncXNtb3V4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0NTIyMTcsImV4cCI6MjEwMjAyODIxN30.y_up4RdCJmCZkD7JXVxypBx93pDfuRBzKPdZrmZqem4';
      const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const loginView=document.querySelector('#login-view');const dashboard=document.querySelector('#dashboard');const authStatus=document.querySelector('#auth-status');const requests=document.querySelector('#requests');const summary=document.querySelector('#summary');
      function escapeHtml(value){return String(value).replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]))}
      async function loadRequests(){const {data,error}=await client.from('contact_requests').select('*').order('created_at',{ascending:false});if(error){summary.textContent='문의 내용을 불러오지 못했습니다. Supabase 스키마와 권한 설정을 확인해 주세요.';return}summary.textContent=`총 ${data.length}개의 이야기가 있습니다.`;requests.innerHTML=data.length?data.map(item=>`<article class="request"><div class="request-top"><div><h2>${escapeHtml(item.name)}</h2><span class="badge">${escapeHtml(item.topic)}</span></div><time>${new Date(item.created_at).toLocaleString('ko-KR')}</time></div><a class="email" href="mailto:${encodeURIComponent(item.email)}">${escapeHtml(item.email)}</a><p class="message">${escapeHtml(item.message)}</p><div class="request-bottom"><select data-id="${item.id}" class="state"><option value="new" ${item.status==='new'?'selected':''}>새 문의</option><option value="replied" ${item.status==='replied'?'selected':''}>답변 완료</option><option value="archived" ${item.status==='archived'?'selected':''}>보관</option></select><button class="delete" data-id="${item.id}">삭제</button></div></article>`).join(''):'<div class="empty">아직 도착한 이야기가 없습니다.</div>';document.querySelectorAll('.state').forEach(select=>select.addEventListener('change',async()=>{await client.from('contact_requests').update({status:select.value}).eq('id',select.dataset.id)}));document.querySelectorAll('.delete').forEach(button=>button.addEventListener('click',async()=>{if(!confirm('이 문의를 삭제할까요?'))return;await client.from('contact_requests').delete().eq('id',button.dataset.id);loadRequests()}))}
      async function showDashboard(session){if(session?.user?.email!=='agfe92@nate.com'){authStatus.textContent='허용되지 않은 관리자 계정입니다.';await client.auth.signOut();return}loginView.style.display='none';dashboard.style.display='block';document.querySelector('#admin-email').textContent=session.user.email;loadRequests()}
      document.querySelector('#login-form').addEventListener('submit',async(event)=>{event.preventDefault();authStatus.textContent='로그인 중입니다.';const {data,error}=await client.auth.signInWithPassword({email:document.querySelector('#email').value,password:document.querySelector('#password').value});if(error){authStatus.textContent=error.message;return}showDashboard(data.session)});
      document.querySelector('#signup').addEventListener('click',async()=>{authStatus.textContent='계정을 만드는 중입니다.';const {error}=await client.auth.signUp({email:document.querySelector('#email').value,password:document.querySelector('#password').value});authStatus.textContent=error?error.message:'인증 이메일을 확인한 뒤 로그인해 주세요.'});
      document.querySelector('#logout').addEventListener('click',()=>client.auth.signOut());client.auth.getSession().then(({data})=>showDashboard(data.session));
    </script>
  </body>
</html>
